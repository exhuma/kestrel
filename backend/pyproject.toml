"app/services/gitlab.py" = ["PLR0913", "PLR2004"]
"app/services/jira_poll.py" = ["PLC0415"]
"app/telemetry.py" = ["PLC0415", "PLW0603"]
"tests/test_claude_backend.py" = ["ARG001"]
"tests/test_config.py" = ["B017", "PLR2004"]
"tests/test_github_client.py" = ["ARG001", "PLR2004"]
"tests/test_github_ports.py" = ["ARG001", "ARG005", "PLC0415"]
"tests/test_gitlab_code_host.py" = ["ARG005"]
"tests/test_health.py" = ["PLC0415", "PLR2004"]
"tests/test_jira_client.py" = ["ARG005"]
